<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: coluna de estudo. Aba Trilha = passos em sequência com exercícios; aba Cartas = revisão espaçada. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --line:#d9dce5; --fg:#1c2030; --dim:#5d6377;
  --accent:#3445c4; --accent-soft:#e6e9fb; --ok:#1d7a45; --ok-soft:#dff1e6; --no:#b3322b; --no-soft:#f8e1df;
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12141b; --surface:#1b1e28; --line:#2c3040; --fg:#e7e9f0; --dim:#979db0;
  --accent:#8b98ff; --accent-soft:#252a4a; --ok:#5fd18e; --ok-soft:#173326; --no:#ff8a80; --no-soft:#3a1c1b; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12141b; --surface:#1b1e28; --line:#2c3040; --fg:#e7e9f0; --dim:#979db0;
  --accent:#8b98ff; --accent-soft:#252a4a; --ok:#5fd18e; --ok-soft:#173326; --no:#ff8a80; --no-soft:#3a1c1b; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:6px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-display);font-size:clamp(26px,6vw,34px);line-height:1.1;margin:0;text-wrap:balance;font-weight:700}
.lede{color:var(--dim);margin:0;max-width:62ch}
kbd{font-family:var(--f-mono);font-size:12px;background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.fsbtn{font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid transparent;border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.fsbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:9px;font-weight:700;color:var(--dim);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--surface)}

/* ---------- Trilha ---------- */
.trail{display:flex;flex-direction:column;gap:18px}
.tmeta{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.dots{display:flex;gap:4px}
.dots button{flex:1;height:8px;min-width:0;border:0;border-radius:4px;background:var(--line);cursor:pointer;padding:0}
.dots button.ok{background:var(--ok)}
.dots button.cur{background:var(--accent)}
.lesson{display:flex;flex-direction:column;gap:16px}
.lesson h2{font-family:var(--f-display);font-size:clamp(24px,5.4vw,30px);line-height:1.15;margin:0;text-wrap:balance}
.sec{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.prose{display:flex;flex-direction:column;gap:12px;font-size:17px;line-height:1.6;max-width:64ch}
.prose p{margin:0}
.prose b{color:var(--accent)}
.prose .aside{font-size:14px;color:var(--dim);border-left:3px solid var(--line);padding-left:12px}

.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.flow li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:15px;line-height:1.45}
.flow li:first-child{border-top:0}
.flow .fl{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding-top:3px}
.flow li:last-child{background:var(--accent-soft)}

.task{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.task.solved{border-color:var(--ok)}
.kind{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.task.solved .kind::after{content:"✓ feito";color:var(--ok)}
.tq{font-weight:700;font-size:17px;margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:16px;line-height:1.4}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--fg)}
.opt.wrong{background:var(--no-soft);border-color:var(--no);color:var(--fg);opacity:.75}
.fb{margin:0;font-size:15px;line-height:1.5;min-height:0}
.fb:empty{display:none}
.fb.ok b{color:var(--ok)} .fb.no b{color:var(--no)}

.seq{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.seq li{counter-increment:s;display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;border:1px dashed var(--line);color:var(--dim);font-size:15px}
.seq li::before{content:counter(s);font-family:var(--f-mono);font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--fg);flex:none}
.seq li.filled{border-style:solid;border-color:var(--ok);background:var(--ok-soft);color:var(--fg)}
.seq li.filled::before{background:var(--ok);color:var(--surface)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool button{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;text-align:left;font-size:15px}
.pool button.shake{border-color:var(--no);background:var(--no-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.sitems{display:flex;flex-direction:column;gap:12px}
.sitem{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.sitem:first-child{border-top:0;padding-top:0}
.stext{font-size:16px;line-height:1.45}
.stext code{display:block;font-family:var(--f-mono);font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:pre}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:13px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.chips button:disabled{cursor:default}
.chips button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.chips button.wrong{background:var(--no-soft);border-color:var(--no);color:var(--no);text-decoration:line-through}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font-size:13px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end;height:130px;border-bottom:1px solid var(--line);padding-top:6px}
.bars div{background:var(--line);border-radius:6px 6px 0 0;transition:background .2s,height .3s;min-height:6px;cursor:pointer}
.bars div.on{background:var(--accent)}
.barlabels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;font-family:var(--f-mono);font-size:10px;color:var(--dim);text-align:center;margin-top:-6px}
.costtext{font-size:16px;margin:0;min-height:3em}
.small{font-size:12px;color:var(--dim);margin:0}

.layers{display:flex;flex-direction:column;gap:6px}
.attack{font-family:var(--f-mono);font-size:12px;color:var(--no)}
.layer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--ok);background:var(--ok-soft)}
.layer.down{border-color:var(--no);background:var(--no-soft);border-style:dashed}
.layer button{font-size:13px;font-weight:700;border:1px solid currentColor;background:transparent;border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--ok);white-space:nowrap}
.layer.down button{color:var(--no)}
.verdict{margin:0;font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}

.tnav{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.tnav button{padding:14px;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer}
.ghostbtn{background:transparent;border:1px solid var(--line);color:var(--dim)}
.ghostbtn:disabled{opacity:.4;cursor:default}
.primary{background:var(--accent);border:1px solid var(--accent);color:var(--surface)}
.endbox{background:var(--accent-soft);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.endbox h3{font-family:var(--f-display);margin:0;font-size:20px}
.endbox p{margin:0}

/* ---------- Cartas ---------- */
.decks{display:flex;flex-wrap:wrap;gap:8px}
.decks button{font-size:14px;background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.decks button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.decks button .n{font-family:var(--f-mono);font-size:11px;opacity:.75;margin-left:6px}
.deckdesc{font-size:14px;color:var(--dim);margin:-6px 0 0;min-height:1.5em}
.play{display:flex;flex-direction:column;gap:18px}
.stage{perspective:1400px}
.card{display:grid;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1);cursor:pointer;outline:none}
.card:focus-visible .face{box-shadow:0 0 0 3px var(--accent)}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:20px 22px 22px;min-height:300px;display:flex;flex-direction:column;gap:14px}
.back{transform:rotateY(180deg)}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.deckname{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.obj{font-size:13px;color:var(--dim);margin:-8px 0 0}
.q{font-family:var(--f-display);font-weight:600;font-size:clamp(20px,4.6vw,24px);line-height:1.3;margin:auto 0;text-wrap:balance}
.a{font-size:17px;line-height:1.6;margin:auto 0}
.a b,.q b{color:var(--accent)}
.hint{font-size:12px;color:var(--dim);text-align:right}
.miss{font-family:var(--f-mono);font-size:11px;color:var(--no);background:var(--no-soft);padding:2px 8px;border-radius:999px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions button{font-weight:700;font-size:16px;padding:14px;border-radius:12px;border:1px solid transparent;cursor:pointer;display:flex;justify-content:center;gap:10px;align-items:center}
.actions button kbd{background:transparent;border-color:currentColor;opacity:.6}
#btnNo{background:var(--no-soft);color:var(--no)}
#btnOk{background:var(--ok-soft);color:var(--ok)}
.actions button:disabled{opacity:.35;cursor:default}
.progress{display:flex;flex-direction:column;gap:8px}
.stats{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;gap:12px;flex-wrap:wrap}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.done{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 22px;display:flex;flex-direction:column;gap:12px}
.done h2{font-family:var(--f-display);margin:0;font-size:24px}
.done p{margin:0;color:var(--dim)}
.done ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.done .row{display:flex;gap:10px;flex-wrap:wrap}
.done button{font-weight:700;padding:11px 18px;border-radius:10px;border:1px solid var(--accent);cursor:pointer;background:var(--accent);color:var(--surface)}
.done button.ghost{background:transparent;color:var(--accent)}

/* Tela cheia: só o conteúdo de estudo. */
body.focus{padding-block:12px 16px}
body.focus .wrap{max-width:860px;gap:12px}
body.focus h1,body.focus .lede,body.focus .tabs,body.focus .decks,body.focus .deckdesc{display:none}
body.focus .face{min-height:calc(100dvh - 230px)}
body.focus .q{font-size:clamp(22px,3.6vw,30px)}
body.focus .a{font-size:clamp(17px,2.4vw,20px)}

/* Celular na horizontal. */
@media (orientation: landscape) and (max-height: 560px){
  body{padding-block:12px 16px}
  .wrap{max-width:none;gap:12px}
  .trail{max-width:820px;width:100%;margin:0 auto}
  .lede{display:none}
  h1{font-size:22px}
  .play{display:grid;grid-template-columns:minmax(0,1fr) 190px;grid-template-rows:1fr auto;gap:12px}
  .stage{grid-row:1 / span 2;min-width:0}
  .actions{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .actions button{flex-direction:column;gap:4px}
  .face{min-height:calc(100dvh - 40px);padding:16px 20px}
  .q{font-size:clamp(19px,2.8vw,24px)}
  .a{font-size:16px}
  body.focus .face{min-height:calc(100dvh - 76px)}
  .flow li{grid-template-columns:110px minmax(0,1fr)}
}

@media (prefers-reduced-motion: reduce){
  .card{transition:none}
  .card.flipped{transform:none}
  .card.flipped .front{visibility:hidden}
  .back{transform:none;visibility:hidden}
  .card.flipped .back{visibility:visible}
  .track i,.bars div{transition:none}
  .pool button.shake{animation:none}
}
</style>

<div class="wrap">
  <header>
    <div class="toprow">
      <span class="eyebrow">LAB-SDLC-IA-SEC · Ponto 1</span>
      <button class="fsbtn" id="btnFs" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span id="fsLabel">Tela cheia</span></button>
